<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My University Website - Contact</title>
</head>
<body>

  <header>
    <h1>Contacto</h1>
  </header>

  <nav>
    <a href="../index.html">Home</a> |
    <a href="courses.html">Courses</a> |
    <a href="schedule.html">Schedule</a> |
    <a href="hobbies.html">Hoobies</a> |
    <a href="clubs.html">Clubs</a> |
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <section>
      <h2>Formulario de contacto</h2>

      <form>

        <p>
          <label for="name">Nombre completo:</label><br>
          <input type="text" id="name" name="name" required>
        </p>

        <p>
          <label for="email">Correo electrónico:</label><br>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="dob">Fecha de nacimiento:</label><br>
          <input type="date" id="dob" name="dob" required>
        </p>

        <p>
          <label for="program">Programa académico:</label><br>
          <select id="program" name="program" required>
            <option value="">-- Selecciona --</option>
            <option value="cs">Ciencias de la Computación</option>
            <option value="biotech">Biotecnología</option>
            <option value="chem">Ingeniería Química</option>
            <option value="other">Otro</option>
          </select>
        </p>

        <p>
          <label for="semester">Semestre:</label><br>
          <input type="number" id="semester" name="semester" min="1" max="10" required>
        </p>

        <p>
          <label for="reason">Motivo de contacto:</label><br>
          <input type="radio" id="reason-academic" name="reason" value="academic">
          <label for="reason-academic">Académico</label>

          <input type="radio" id="reason-tech" name="reason" value="technical">
          <label for="reason-tech">Técnico</label>

          <input type="radio" id="reason-other" name="reason" value="other">
          <label for="reason-other">Otro</label>
        </p>

        <p>
          <label for="message">Mensaje:</label><br>
          <textarea id="message" name="message" rows="5" cols="40" required></textarea>
        </p>

        <p>
          <input type="checkbox" id="accept" name="accept" required>
          <label for="accept">Acepto los términos y condiciones</label>
        </p>

        <p>
          <button type="submit">Enviar</button>
        </p>

      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Emma — Yachay Tech.</p>
  </footer>

</body>
</html>
